# Builds the Astro site and publishes it to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
#
# Project site URL: https://<owner>.github.io/<repo>/
# For a custom domain, set the repository variables SITE_URL (e.g.
# https://demandletter.hoffman.legal) and BASE_PATH ("/").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
          PUBLIC_INTAKE_PROVIDER: ${{ vars.PUBLIC_INTAKE_PROVIDER }}
          PUBLIC_INTAKE_ENDPOINT: ${{ vars.PUBLIC_INTAKE_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
